<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>КАССА — учёт финансов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  :root{
    --bg:#121613;
    --surface:#1a201c;
    --surface-2:#212823;
    --border:#323b34;
    --border-soft:#293029;
    --text:#ECE7DA;
    --text-muted:#8B958C;
    --income:#6FBF8A;
    --income-dim:#3a5744;
    --expense:#D9714C;
    --expense-dim:#5a3a2c;
    --accent:#E3B23C;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --font-sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:92px;
  }

  /* ---------- header / receipt title ---------- */
  .receipt-head{
    padding:22px 20px 16px;
    text-align:center;
    border-bottom:1px dashed var(--border);
    position:relative;
  }
  .brand{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:22px;
    letter-spacing:6px;
    color:var(--accent);
  }
  .brand-sub{
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:4px;
  }

  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:16px 20px 4px;
  }
  .month-nav button{
    background:none;border:1px solid var(--border);
    color:var(--text-muted);
    width:32px;height:32px;border-radius:8px;
    font-family:var(--font-mono);font-size:15px;
    cursor:pointer;
  }
  .month-nav button:active{background:var(--surface-2);}
  .month-label{
    font-family:var(--font-mono);
    font-size:15px;
    font-weight:600;
    min-width:150px;
    text-align:center;
    text-transform:capitalize;
  }

  /* ---------- summary receipt lines ---------- */
  .summary{
    margin:14px 20px 0;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:16px 18px 6px;
  }
  .line{
    display:flex;
    align-items:baseline;
    font-family:var(--font-mono);
    font-size:14px;
    padding:7px 0;
    gap:6px;
  }
  .line .label{
    color:var(--text-muted);
    white-space:nowrap;
  }
  .line .dots{
    flex:1;
    border-bottom:1px dotted var(--border);
    transform:translateY(-3px);
  }
  .line .val{
    white-space:nowrap;
    font-weight:600;
  }
  .line.income .val{color:var(--income);}
  .line.expense .val{color:var(--expense);}
  .line.balance{
    border-top:1px dashed var(--border);
    margin-top:4px;
    padding-top:12px;
  }
  .line.balance .label{color:var(--text); font-size:13px; letter-spacing:1px; text-transform:uppercase;}
  .line.balance .val{font-size:19px; color:var(--accent);}

  /* ---------- section headings ---------- */
  .section-title{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:26px 20px 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{
    content:"";
    flex:1;
    border-bottom:1px dashed var(--border);
  }

  /* ---------- chart / categories ---------- */
  .chart-card{
    margin:0 20px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:16px 18px;
  }
  .chart-wrap{
    position:relative;
    width:150px;
    height:150px;
    margin:4px auto 14px;
  }
  .chart-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .chart-center .amt{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:15px;
    color:var(--expense);
  }
  .chart-center .lbl{
    font-size:10px;
    color:var(--text-muted);
    letter-spacing:1px;
    margin-top:2px;
  }
  .cat-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    padding:8px 0;
    border-top:1px solid var(--border-soft);
  }
  .cat-row:first-child{border-top:none;}
  .cat-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
  .cat-name{flex:1;}
  .cat-pct{color:var(--text-muted); font-family:var(--font-mono); font-size:12px; width:34px; text-align:right;}
  .cat-amt{font-family:var(--font-mono); font-weight:600; width:88px; text-align:right;}
  .empty-note{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    padding:20px 10px;
  }

  /* ---------- transactions list ---------- */
  .day-group{margin:0 20px 4px;}
  .day-head{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:1px;
    margin:16px 2px 6px;
    text-transform:uppercase;
  }
  .tx{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:12px;
    padding:11px 14px;
    margin-bottom:8px;
  }
  .tx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .tx-info{flex:1; min-width:0;}
  .tx-cat{font-size:13.5px; font-weight:500;}
  .tx-note{font-size:11.5px; color:var(--text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx-amt{font-family:var(--font-mono); font-weight:600; font-size:14px; white-space:nowrap;}
  .tx-amt.income{color:var(--income);}
  .tx-amt.expense{color:var(--expense);}
  .tx-del{
    background:none;border:none;color:var(--text-muted);
    font-size:15px; padding:2px 4px; cursor:pointer; line-height:1;
  }
  .tx-del:active{color:var(--expense);}

  /* ---------- bottom nav ---------- */
  .navbar{
    position:fixed;
    bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:460px;
    background:var(--surface);
    border-top:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .nav-btn{
    background:none;border:none;color:var(--text-muted);
    font-family:var(--font-sans);
    font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    cursor:pointer; padding:4px 10px;
    letter-spacing:0.3px;
  }
  .nav-btn.active{color:var(--accent);}
  .nav-btn svg{width:20px;height:20px;}
  .fab{
    width:52px;height:52px;border-radius:50%;
    background:var(--accent);
    color:#20220f;
    border:none;
    font-size:26px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    margin-top:-30px;
    box-shadow:0 6px 16px rgba(227,178,60,0.35);
  }
  .fab:active{transform:scale(0.94);}

  /* ---------- sheet / modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    z-index:30; display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    width:100%; max-width:460px;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    padding:18px 20px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
    max-height:88vh;
    overflow-y:auto;
    animation:slideup .22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{
    width:36px;height:4px;background:var(--border);
    border-radius:2px;margin:0 auto 14px;
  }
  .sheet h2{
    font-family:var(--font-mono);
    font-size:16px;
    margin:0 0 16px;
    letter-spacing:0.5px;
  }
  .type-toggle{
    display:flex;
    background:var(--surface-2);
    border-radius:10px;
    padding:3px;
    margin-bottom:16px;
  }
  .type-toggle button{
    flex:1; border:none; background:none;
    padding:9px 0; border-radius:8px;
    font-family:var(--font-sans); font-weight:600; font-size:13px;
    color:var(--text-muted); cursor:pointer;
  }
  .type-toggle button.active.expense{background:var(--expense-dim); color:var(--expense);}
  .type-toggle button.active.income{background:var(--income-dim); color:var(--income);}

  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:11px; color:var(--text-muted);
    letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;
  }
  .amount-input{
    display:flex; align-items:baseline; gap:6px;
    border-bottom:1px solid var(--border);
    padding-bottom:8px;
  }
  .amount-input input{
    flex:1; background:none; border:none; outline:none;
    color:var(--text); font-family:var(--font-mono);
    font-size:28px; font-weight:600; width:100%;
  }
  .amount-input .cur{font-family:var(--font-mono); font-size:18px; color:var(--text-muted);}
  input[type=text], input[type=date]{
    width:100%; background:var(--surface-2); border:1px solid var(--border-soft);
    border-radius:10px; padding:11px 12px; color:var(--text);
    font-family:var(--font-sans); font-size:14px; outline:none;
  }
  .chip-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:8px 13px; border-radius:20px;
    background:var(--surface-2); border:1px solid var(--border-soft);
    font-size:12.5px; color:var(--text-muted); cursor:pointer;
  }
  .chip.active{
    border-color:var(--accent); color:var(--accent); background:rgba(227,178,60,0.1);
  }
  .save-btn{
    width:100%; padding:14px 0; border:none; border-radius:12px;
    background:var(--accent); color:#20220f;
    font-family:var(--font-mono); font-weight:700; font-size:14px;
    letter-spacing:0.5px; margin-top:6px; cursor:pointer;
  }
  .save-btn:active{transform:scale(0.98);}
  .close-x{
    position:absolute; top:16px; right:18px;
    background:none;border:none;color:var(--text-muted);
    font-size:18px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="app">

  <div class="receipt-head">
    <div class="brand">КАССА</div>
    <div class="brand-sub">личный учёт денег</div>
  </div>

  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="month-label" id="monthLabel">—</div>
    <button id="nextMonth">›</button>
  </div>

  <div class="summary">
    <div class="line income">
      <span class="label">Доходы</span><span class="dots"></span>
      <span class="val" id="sumIncome">0 ₸</span>
    </div>
    <div class="line expense">
      <span class="label">Расходы</span><span class="dots"></span>
      <span class="val" id="sumExpense">0 ₸</span>
    </div>
    <div class="line balance">
      <span class="label">Баланс</span><span class="dots"></span>
      <span class="val" id="sumBalance">0 ₸</span>
    </div>
  </div>

  <div class="section-title">Расходы по категориям</div>
  <div class="chart-card">
    <div class="chart-wrap"><canvas id="catChart"></canvas>
      <div class="chart-center"><div class="amt" id="chartTotal">0 ₸</div><div class="lbl">за месяц</div></div>
    </div>
    <div id="catList"></div>
  </div>

  <div class="section-title">Операции</div>
  <div id="txList" style="margin:0 0 4px;"></div>

  <div class="navbar">
    <button class="nav-btn active" id="navHome">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9z"/></svg>
      Обзор
    </button>
    <button class="fab" id="openAdd">+</button>
    <button class="nav-btn" id="navHistoryDummy">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      История
    </button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="close-x" id="closeSheet">✕</button>
    <div class="sheet-handle"></div>
    <h2>Пробить чек</h2>

    <div class="type-toggle">
      <button class="active expense" id="toggleExpense" data-type="expense">Расход</button>
      <button class="income" id="toggleIncome" data-type="income">Доход</button>
    </div>

    <div class="field">
      <label>Сумма</label>
      <div class="amount-input">
        <input type="text" inputmode="numeric" id="amountInput" placeholder="0">
        <span class="cur">₸</span>
      </div>
    </div>

    <div class="field">
      <label>Категория</label>
      <div class="chip-grid" id="categoryChips"></div>
    </div>

    <div class="field">
      <label>Дата</label>
      <input type="date" id="dateInput">
    </div>

    <div class="field">
      <label>Заметка (необязательно)</label>
      <input type="text" id="noteInput" placeholder="например: продукты на неделю">
    </div>

    <button class="save-btn" id="saveTx">Пробить чек ✓</button>
  </div>
</div>

<script>
(function(){
  const EXP_CATS = [
    {name:'Еда', color:'#D9714C'},
    {name:'Транспорт', color:'#C98A3E'},
    {name:'Жильё', color:'#B5673F'},
    {name:'Развлечения', color:'#C4527A'},
    {name:'Здоровье', color:'#8E6FBF'},
    {name:'Одежда', color:'#5E8FBF'},
    {name:'Связь', color:'#5FA3A0'},
    {name:'Прочее', color:'#7A8580'},
  ];
  const INC_CATS = [
    {name:'Зарплата', color:'#6FBF8A'},
    {name:'Подработка', color:'#8FCB6F'},
    {name:'Подарки', color:'#5FBFAB'},
    {name:'Прочее', color:'#7A8580'},
  ];
  const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  let txs = [];
  let currentType = 'expense';
  let currentCat = EXP_CATS[0].name;
  let viewDate = new Date();
  let chart = null;
  let loaded = false;

  const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₸';
  const catColor = (type, name) => (type==='expense'?EXP_CATS:INC_CATS).find(c=>c.name===name)?.color || '#7A8580';

  async function loadTxs(){
    try{
      const raw = localStorage.getItem('kassa_transactions');
      txs = raw ? JSON.parse(raw) : [];
    }catch(e){ txs = []; }
    loaded = true;
    render();
  }
  async function saveTxs(){
    try{ localStorage.setItem('kassa_transactions', JSON.stringify(txs)); }
    catch(e){ console.error('storage error', e); }
  }

  function monthKey(d){ return d.getFullYear()+'-'+d.getMonth(); }

  function txsForMonth(){
    return txs.filter(t=>{
      const d = new Date(t.date+'T00:00:00');
      return monthKey(d) === monthKey(viewDate);
    });
  }

  function renderMonthLabel(){
    document.getElementById('monthLabel').textContent = MONTHS_NOM[viewDate.getMonth()] + ' ' + viewDate.getFullYear();
  }

  function renderSummary(list){
    const income = list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const expense = list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    document.getElementById('sumIncome').textContent = fmt(income);
    document.getElementById('sumExpense').textContent = fmt(expense);
    document.getElementById('sumBalance').textContent = fmt(income-expense);
    document.getElementById('chartTotal').textContent = fmt(expense);
  }

  function renderChart(list){
    const expenses = list.filter(t=>t.type==='expense');
    const byCat = {};
    expenses.forEach(t=>{ byCat[t.category] = (byCat[t.category]||0) + t.amount; });
    const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const total = expenses.reduce((s,t)=>s+t.amount,0);

    const ctx = document.getElementById('catChart').getContext('2d');
    const labels = entries.map(e=>e[0]);
    const data = entries.map(e=>e[1]);
    const colors = entries.map(e=>catColor('expense', e[0]));

    if(chart) chart.destroy();
    if(entries.length===0){
      document.getElementById('catList').innerHTML = '<div class="empty-note">В этом месяце расходов пока нет</div>';
      return;
    }
    chart = new Chart(ctx, {
      type:'doughnut',
      data:{ labels, datasets:[{ data, backgroundColor:colors, borderColor:'#1a201c', borderWidth:2 }] },
      options:{
        cutout:'72%',
        plugins:{ legend:{display:false}, tooltip:{enabled:true} },
        animation:{ duration:400 }
      }
    });

    document.getElementById('catList').innerHTML = entries.map(([name, amt])=>{
      const pct = total ? Math.round(amt/total*100) : 0;
      return `<div class="cat-row">
        <span class="cat-dot" style="background:${catColor('expense',name)}"></span>
        <span class="cat-name">${name}</span>
        <span class="cat-pct">${pct}%</span>
        <span class="cat-amt">${fmt(amt)}</span>
      </div>`;
    }).join('');
  }

  function renderList(list){
    const el = document.getElementById('txList');
    if(list.length===0){
      el.innerHTML = '<div class="empty-note">Операций пока нет — нажмите «+», чтобы добавить первую</div>';
      return;
    }
    const byDay = {};
    list.forEach(t=>{ (byDay[t.date] = byDay[t.date]||[]).push(t); });
    const days = Object.keys(byDay).sort((a,b)=> b.localeCompare(a));

    el.innerHTML = days.map(day=>{
      const d = new Date(day+'T00:00:00');
      const label = d.getDate() + ' ' + MONTHS[d.getMonth()];
      const rows = byDay[day].sort((a,b)=> (b.id||0)-(a.id||0)).map(t=>`
        <div class="tx">
          <span class="tx-dot" style="background:${catColor(t.type,t.category)}"></span>
          <div class="tx-info">
            <div class="tx-cat">${t.category}</div>
            ${t.note ? `<div class="tx-note">${escapeHtml(t.note)}</div>` : ''}
          </div>
          <span class="tx-amt ${t.type}">${t.type==='expense'?'−':'+'}${fmt(t.amount)}</span>
          <button class="tx-del" data-id="${t.id}">✕</button>
        </div>`).join('');
      return `<div class="day-group"><div class="day-head">${label}</div>${rows}</div>`;
    }).join('');

    el.querySelectorAll('.tx-del').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = Number(btn.dataset.id);
        txs = txs.filter(t=>t.id!==id);
        await saveTxs();
        render();
      });
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    if(!loaded) return;
    renderMonthLabel();
    const list = txsForMonth();
    renderSummary(list);
    renderChart(list);
    renderList(list);
  }

  document.getElementById('prevMonth').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
    render();
  });

  // --- add-transaction sheet ---
  const overlay = document.getElementById('overlay');
  const dateInput = document.getElementById('dateInput');

  function renderChips(){
    const cats = currentType==='expense' ? EXP_CATS : INC_CATS;
    if(!cats.find(c=>c.name===currentCat)) currentCat = cats[0].name;
    document.getElementById('categoryChips').innerHTML = cats.map(c=>
      `<div class="chip ${c.name===currentCat?'active':''}" data-cat="${c.name}">${c.name}</div>`
    ).join('');
    document.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        currentCat = chip.dataset.cat;
        renderChips();
      });
    });
  }

  function openSheet(){
    dateInput.value = new Date().toISOString().slice(0,10);
    document.getElementById('amountInput').value = '';
    document.getElementById('noteInput').value = '';
    currentType = 'expense';
    currentCat = EXP_CATS[0].name;
    updateToggle();
    renderChips();
    overlay.classList.add('show');
  }
  function closeSheet(){ overlay.classList.remove('show'); }

  document.getElementById('openAdd').addEventListener('click', openSheet);
  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeSheet(); });

  function updateToggle(){
    document.getElementById('toggleExpense').classList.toggle('active', currentType==='expense');
    document.getElementById('toggleIncome').classList.toggle('active', currentType==='income');
  }
  document.getElementById('toggleExpense').addEventListener('click', ()=>{ currentType='expense'; updateToggle(); renderChips(); });
  document.getElementById('toggleIncome').addEventListener('click', ()=>{ currentType='income'; updateToggle(); renderChips(); });

  document.getElementById('amountInput').addEventListener('input', e=>{
    e.target.value = e.target.value.replace(/[^0-9]/g,'');
  });

  document.getElementById('saveTx').addEventListener('click', async ()=>{
    const amount = Number(document.getElementById('amountInput').value);
    if(!amount || amount<=0){
      document.getElementById('amountInput').focus();
      return;
    }
    const date = dateInput.value || new Date().toISOString().slice(0,10);
    const note = document.getElementById('noteInput').value.trim();
    txs.push({ id: Date.now(), type: currentType, amount, category: currentCat, date, note });
    await saveTxs();
    // jump view to the month of the new transaction
    const d = new Date(date+'T00:00:00');
    viewDate = new Date(d.getFullYear(), d.getMonth(), 1);
    closeSheet();
    render();
  });

  document.getElementById('navHistoryDummy').addEventListener('click', ()=>{
    document.getElementById('txList').scrollIntoView({behavior:'smooth', block:'start'});
  });

  loadTxs();
})();
</script>
</body>
</html>
