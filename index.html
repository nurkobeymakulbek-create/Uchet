<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Касса</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#000;--cell:#1C1C1E;--cell-2:#2C2C2E;--cell-3:#3A3A3C;--sep:#38383A;--lbl:#fff;--lbl2:#98989D;--lbl3:#636366;--blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--lbl);font-family:var(--font);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:460px;min-height:100vh;position:relative;padding-bottom:110px}
.tab-screen{display:none}.tab-screen.active{display:block;animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.large-title{font-size:34px;font-weight:700;letter-spacing:-.02em;padding:calc(env(safe-area-inset-top) + 12px) 16px 6px}
.month-switch{display:flex;align-items:center;justify-content:space-between;background:var(--cell-2);border-radius:10px;margin:8px 16px 18px;padding:4px}
.month-switch button{background:none;border:none;color:var(--blue);width:34px;height:34px;border-radius:8px;font-size:17px;font-weight:600;cursor:pointer}
.month-switch button:active{background:var(--cell-3)}
.month-switch .month-label{font-size:15px;font-weight:600;text-transform:capitalize}
.section-label{font-size:13px;color:var(--lbl2);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 7px}
.ios-list{background:var(--cell);border-radius:14px;margin:0 16px;overflow:hidden}
.ios-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--sep);position:relative}
.ios-row:last-child{border-bottom:none}
.ios-row:active{background:var(--cell-2)}
.row-label{font-size:16px;flex:1}
.row-value{font-family:var(--mono);font-size:16px;font-weight:500}
.row-value.green{color:var(--green)}.row-value.red{color:var(--red)}
.row-value.big{font-size:19px;font-weight:700;color:var(--blue)}
.chart-card{padding:18px 16px 8px;text-align:center}
.chart-wrap{position:relative;width:158px;height:158px;margin:0 auto 6px}
.chart-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.chart-center .amt{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--red)}
.chart-center .lbl{font-size:11px;color:var(--lbl2);margin-top:2px}
.empty-note{text-align:center;color:var(--lbl2);font-size:14px;padding:26px 20px}
.cat-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:.5px solid var(--sep)}
.cat-row:last-child{border-bottom:none}
.cat-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.cat-name{flex:1;font-size:15px}
.cat-pct{color:var(--lbl2);font-family:var(--mono);font-size:12px;width:32px;text-align:right}
.cat-amt{font-family:var(--mono);font-weight:600;font-size:14.5px;width:92px;text-align:right}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0}
.day-head{font-size:13px;color:var(--lbl2);text-transform:uppercase;letter-spacing:.02em;margin:20px 16px 7px}
.row-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:13px;font-weight:700}
.row-main{flex:1;min-width:0}
.row-title{font-size:15.5px;font-weight:500}
.row-sub{font-size:12.5px;color:var(--lbl2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap}
.row-amt.income{color:var(--green)}.row-amt.expense{color:var(--red)}
.chevron{color:var(--lbl3);font-size:14px;margin-left:2px}
.rec-badge{font-size:11px;color:var(--lbl2);margin-left:4px}
.check-toggle{width:24px;height:24px;border-radius:50%;border:2px solid var(--lbl3);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.check-toggle.on{background:var(--green);border-color:var(--green)}
.check-toggle svg{width:13px;height:13px;opacity:0}
.check-toggle.on svg{opacity:1}
.debt-row.settled .row-title,.debt-row.settled .row-amt{text-decoration:line-through;opacity:.45}
.debt-row.settled .row-sub{opacity:.45}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:rgba(28,28,30,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);display:flex;padding:8px 0 calc(4px + env(safe-area-inset-bottom));z-index:20}
.tab-item{flex:1;background:none;border:none;color:var(--lbl3);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-family:var(--font);padding:4px 0;cursor:pointer}
.tab-item svg{width:25px;height:25px}
.tab-item.active{color:var(--blue)}
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(calc(-50% + 175px));width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:21;box-shadow:0 4px 14px rgba(10,132,255,.45)}
.fab:active{transform:translateX(calc(-50% + 175px)) scale(.94)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:100%;max-width:460px;background:var(--cell);border-radius:14px 14px 0 0;max-height:90vh;overflow-y:auto;animation:slideup .22s ease-out;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:5px;background:var(--lbl3);border-radius:3px;margin:8px auto 2px;opacity:.5}
.sheet-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:.5px solid var(--sep)}
.sheet-nav button{background:none;border:none;color:var(--blue);font-size:16.5px;font-family:var(--font);cursor:pointer;padding:4px 2px}
.sheet-nav button.save{font-weight:600}
.sheet-title{font-size:16px;font-weight:600}
.form-body{padding:18px 16px 6px}
.type-toggle{display:flex;background:var(--cell-2);border-radius:9px;padding:2px;margin-bottom:20px}
.type-toggle button{flex:1;border:none;background:none;padding:8px 0;border-radius:7px;font-family:var(--font);font-weight:600;font-size:13.5px;color:var(--lbl2);cursor:pointer}
.type-toggle button.active.expense{background:var(--cell-3);color:var(--red)}
.type-toggle button.active.income{background:var(--cell-3);color:var(--green)}
.type-toggle button.active.in{background:var(--cell-3);color:var(--green)}
.type-toggle button.active.out{background:var(--cell-3);color:var(--red)}
.type-toggle button.active.none{background:var(--cell-3);color:var(--lbl)}
.type-toggle button.active.monthly{background:var(--cell-3);color:var(--blue)}
.amount-input{text-align:center;margin-bottom:22px}
.amount-input input{background:none;border:none;outline:none;text-align:center;color:var(--lbl);font-family:var(--mono);font-size:40px;font-weight:700;width:100%}
.amount-input .cur{font-size:15px;color:var(--lbl2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--lbl2);margin-bottom:6px;padding-left:2px}
input[type=text],input[type=date],input[type=number]{width:100%;background:var(--cell-2);border:none;border-radius:10px;padding:12px 13px;color:var(--lbl);font-family:var(--font);font-size:15px;outline:none}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:20px;background:var(--cell-2);font-size:13px;color:var(--lbl2);cursor:pointer}
.chip.active{background:var(--blue);color:#fff}
.delete-btn{width:100%;padding:13px 0;border:none;border-radius:12px;background:var(--cell-2);color:var(--red);font-family:var(--font);font-weight:600;font-size:15px;margin-top:8px;cursor:pointer}
.budget-total{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.budget-total .bt-label{font-size:15px;color:var(--lbl2)}
.budget-total .bt-val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--blue)}
.budget-row{padding:14px 16px;border-bottom:.5px solid var(--sep);cursor:pointer}
.budget-row:last-child{border-bottom:none}
.budget-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.budget-top .b-name{flex:1;font-size:15px}
.budget-top .b-val{font-family:var(--mono);font-size:13.5px;font-weight:600}
.b-val.over{color:var(--red)}.b-val.warn{color:var(--orange)}.b-val.ok{color:var(--lbl2)}
.budget-bar{height:6px;background:var(--cell-3);border-radius:3px;overflow:hidden}
.budget-bar-fill{height:100%;border-radius:3px;transition:width .3s ease}
</style>
</head>
<body>
<div id="app">

<div class="tab-screen active" id="tab-overview">
  <div class="large-title">Учет</div>
  <div class="month-switch"><button data-nav="-1">‹</button><div class="month-label" id="monthLabel1">—</div><button data-nav="1">›</button></div>
  <div class="ios-list">
    <div class="ios-row"><span class="row-label">Доходы</span><span class="row-value green" id="sumIncome">0 ₸</span></div>
    <div class="ios-row"><span class="row-label">Расходы</span><span class="row-value red" id="sumExpense">0 ₸</span></div>
    <div class="ios-row"><span class="row-label">Баланс</span><span class="row-value big" id="sumBalance">0 ₸</span></div>
  </div>
  <div class="section-label">Расходы по категориям</div>
  <div class="ios-list">
    <div class="chart-card"><div class="chart-wrap"><canvas id="catChart"></canvas><div class="chart-center"><div class="amt" id="chartTotal">0 ₸</div><div class="lbl">за месяц</div></div></div></div>
    <div id="catList"></div>
  </div>
</div>

<div class="tab-screen" id="tab-history">
  <div class="large-title">История</div>
  <div class="month-switch"><button data-nav="-1">‹</button><div class="month-label" id="monthLabel2">—</div><button data-nav="1">›</button></div>
  <div id="txListWrap"></div>
</div>

<div class="tab-screen" id="tab-budgets">
  <div class="large-title">Бюджеты</div>
  <div class="month-switch"><button data-nav="-1">‹</button><div class="month-label" id="monthLabel3">—</div><button data-nav="1">›</button></div>
  <div class="ios-list"><div class="budget-total"><span class="bt-label">Заложено на месяц</span><span class="bt-val" id="budgetTotal">0 ₸</span></div></div>
  <div class="section-label">Лимиты по категориям</div>
  <div class="ios-list" id="budgetList"></div>
</div>

<div class="tab-screen" id="tab-debts">
  <div class="large-title">Долги</div>
  <div class="ios-list">
    <div class="ios-row"><span class="row-label">Мне должны</span><span class="row-value green" id="debtIn">0 ₸</span></div>
    <div class="ios-row"><span class="row-label">Я должен</span><span class="row-value red" id="debtOut">0 ₸</span></div>
  </div>
  <div id="debtListWrap"></div>
</div>

<button class="fab" id="fabBtn">+</button>
<div class="tabbar">
  <button class="tab-item active" data-tab="overview"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9z"/></svg>Главная</button>
  <button class="tab-item" data-tab="history"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>История</button>
  <button class="tab-item" data-tab="budgets"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Бюджеты</button>
  <button class="tab-item" data-tab="debts"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M7 3h8l4 4v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h4"/></svg>Долги</button>
</div>
</div>

<div class="overlay" id="txOverlay"><div class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-nav"><button id="txCancel">Отмена</button><span class="sheet-title" id="txSheetTitle">Операция</span><button class="save" id="txSave">Готово</button></div>
  <div class="form-body">
    <div class="type-toggle"><button class="active expense" id="toggleExpense">Расход</button><button class="income" id="toggleIncome">Доход</button></div>
    <div class="amount-input"><input type="text" inputmode="numeric" id="amountInput" placeholder="0"><div class="cur">₸</div></div>
    <div class="field"><label>Категория</label><div class="chip-grid" id="categoryChips"></div></div>
    <div class="field"><label>Дата</label><input type="date" id="dateInput"></div>
    <div class="field"><label>Повторять</label><div class="type-toggle" style="margin-bottom:0"><button class="active none" id="toggleOnce">Не повторять</button><button class="monthly" id="toggleMonthly">Каждый месяц</button></div></div>
    <div class="field" id="recDayField" style="display:none"><label>День месяца (1–31)</label><input type="number" id="recDayInput" min="1" max="31" placeholder="10"></div>
    <div class="field"><label>Заметка</label><input type="text" id="noteInput" placeholder="например: продукты на неделю"></div>
    <button class="delete-btn" id="txDelete" style="display:none">Удалить операцию</button>
  </div>
</div></div>

<div class="overlay" id="debtOverlay"><div class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-nav"><button id="debtCancel">Отмена</button><span class="sheet-title" id="debtSheetTitle">Долг</span><button class="save" id="debtSave">Готово</button></div>
  <div class="form-body">
    <div class="type-toggle"><button class="active in" id="toggleIn">Мне должны</button><button class="out" id="toggleOut">Я должен</button></div>
    <div class="amount-input"><input type="text" inputmode="numeric" id="debtAmountInput" placeholder="0"><div class="cur">₸</div></div>
    <div class="field"><label>Имя</label><input type="text" id="debtPersonInput" placeholder="например: Айгуль"></div>
    <div class="field"><label>Дата</label><input type="date" id="debtDateInput"></div>
    <div class="field"><label>Заметка</label><input type="text" id="debtNoteInput" placeholder="например: заняла на такси"></div>
    <button class="delete-btn" id="debtDelete" style="display:none">Удалить долг</button>
  </div>
</div></div>

<div class="overlay" id="budgetOverlay"><div class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-nav"><button id="budgetCancel">Отмена</button><span class="sheet-title" id="budgetSheetTitle">Бюджет</span><button class="save" id="budgetSave">Готово</button></div>
  <div class="form-body">
    <div class="field"><label>Лимит на категорию</label><input type="text" inputmode="numeric" id="budgetAmountInput" placeholder="0"></div>
    <div class="field"><label>Категория</label><div class="chip-grid" id="budgetChips"></div></div>
    <button class="delete-btn" id="budgetDelete" style="display:none">Убрать лимит</button>
  </div>
</div></div>

<script>
(function(){
const EXP_CATS=[{name:'Еда',color:'#FF453A'},{name:'Транспорт',color:'#FF9F0A'},{name:'Жильё',color:'#FFD60A'},{name:'Развлечения',color:'#BF5AF2'},{name:'Здоровье',color:'#FF375F'},{name:'Одежда',color:'#5E5CE6'},{name:'Связь',color:'#64D2FF'},{name:'Прочее',color:'#98989D'}];
const INC_CATS=[{name:'Зарплата',color:'#30D158'},{name:'Подработка',color:'#66D4CF'},{name:'Подарки',color:'#63E6BE'},{name:'Прочее',color:'#98989D'}];
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

let txs=[],debts=[],budgets={};
let activeTab='overview';
let viewDate=new Date();
let chart=null,loaded=false;
let txEditId=null,txType='expense',txCat=EXP_CATS[0].name,txRecurring='none',txRecDay=1;
let debtEditId=null,debtDir='in';
let budgetEditCat=null;

const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₸';
const catColor=(type,name)=>(type==='expense'?EXP_CATS:INC_CATS).find(c=>c.name===name)?.color||'#98989D';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function loadAll(){
  try{txs=JSON.parse(localStorage.getItem('kassa_transactions')||'[]')}catch(e){txs=[]}
  try{debts=JSON.parse(localStorage.getItem('kassa_debts')||'[]')}catch(e){debts=[]}
  try{budgets=JSON.parse(localStorage.getItem('kassa_budgets')||'{}')}catch(e){budgets={}}
  loaded=true;
  runRecurring();
  render();
}
function saveTxs(){try{localStorage.setItem('kassa_transactions',JSON.stringify(txs))}catch(e){}}
function saveDebts(){try{localStorage.setItem('kassa_debts',JSON.stringify(debts))}catch(e){}}
function saveBudgets(){try{localStorage.setItem('kassa_budgets',JSON.stringify(budgets))}catch(e){}}

function monthKey(d){return d.getFullYear()+'-'+d.getMonth()}
function monthKeyFromStr(s){const d=new Date(s+'T00:00:00');return monthKey(d)}
function txsForMonth(){return txs.filter(t=>monthKeyFromStr(t.date)===monthKey(viewDate))}

function runRecurring(){
  const now=new Date();
  const curKey=monthKey(now);
  let changed=false;
  txs.forEach(t=>{
    if(t.recurring!=='monthly')return;
    const day=t.recDay||1;
    if(now.getDate()>=day && t.lastCreated!==curKey){
      const y=now.getFullYear(),m=now.getMonth();
      const lastDay=new Date(y,m+1,0).getDate();
      const useDay=Math.min(day,lastDay);
      const dateStr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(useDay).padStart(2,'0');
      const exists=txs.some(x=>x.templateId===t.id && monthKeyFromStr(x.date)===curKey);
      if(!exists){
        txs.push({id:Date.now()+Math.floor(Math.random()*1000),type:t.type,amount:t.amount,category:t.category,date:dateStr,note:t.note,templateId:t.id});
        changed=true;
      }
      t.lastCreated=curKey;
      changed=true;
    }
  });
  if(changed)saveTxs();
}

document.querySelectorAll('.tab-item').forEach(btn=>{
  btn.addEventListener('click',()=>{
    activeTab=btn.dataset.tab;
    document.querySelectorAll('.tab-item').forEach(b=>b.classList.toggle('active',b===btn));
    document.querySelectorAll('.tab-screen').forEach(s=>s.classList.toggle('active',s.id==='tab-'+activeTab));
    window.scrollTo(0,0);
    render();
  });
});
document.querySelectorAll('.month-switch button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+Number(btn.dataset.nav),1);
    render();
  });
});

function render(){
  if(!loaded)return;
  const label=MONTHS_NOM[viewDate.getMonth()]+' '+viewDate.getFullYear();
  ['monthLabel1','monthLabel2','monthLabel3'].forEach(id=>document.getElementById(id).textContent=label);
  const list=txsForMonth();
  renderSummary(list);
  renderChart(list);
  renderHistory(list);
  renderBudgets(list);
  renderDebts();
}

function renderSummary(list){
  const income=list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  document.getElementById('sumIncome').textContent=fmt(income);
  document.getElementById('sumExpense').textContent=fmt(expense);
  document.getElementById('sumBalance').textContent=fmt(income-expense);
  document.getElementById('chartTotal').textContent=fmt(expense);
}

function renderChart(list){
  const expenses=list.filter(t=>t.type==='expense');
  const byCat={};
  expenses.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount});
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const total=expenses.reduce((s,t)=>s+t.amount,0);
  if(chart){chart.destroy();chart=null}
  if(entries.length===0){
    document.getElementById('catList').innerHTML='<div class="empty-note">В этом месяце расходов пока нет</div>';
    return;
  }
  try{
    const ctx=document.getElementById('catChart').getContext('2d');
    chart=new Chart(ctx,{type:'doughnut',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:entries.map(e=>catColor('expense',e[0])),borderColor:'#1C1C1E',borderWidth:2}]},options:{cutout:'72%',plugins:{legend:{display:false}},animation:{duration:350}}});
  }catch(e){}
  document.getElementById('catList').innerHTML=entries.map(([name,amt])=>{
    const pct=total?Math.round(amt/total*100):0;
    return '<div class="cat-row"><span class="cat-dot" style="background:'+catColor('expense',name)+'"></span><span class="cat-name">'+esc(name)+'</span><span class="cat-pct">'+pct+'%</span><span class="cat-amt">'+fmt(amt)+'</span></div>';
  }).join('');
}

function renderHistory(list){
  const el=document.getElementById('txListWrap');
  if(list.length===0){
    el.innerHTML='<div class="empty-note">Операций пока нет — нажмите «+», чтобы добавить</div>';
    return;
  }
  const byDay={};
  list.forEach(t=>{(byDay[t.date]=byDay[t.date]||[]).push(t)});
  const days=Object.keys(byDay).sort((a,b)=>b.localeCompare(a));
  el.innerHTML=days.map(day=>{
    const d=new Date(day+'T00:00:00');
    const label=d.getDate()+' '+MONTHS[d.getMonth()];
    const rows=byDay[day].sort((a,b)=>(b.id||0)-(a.id||0)).map(t=>{
      const rec=t.recurring==='monthly'?'<span class="rec-badge">🔁</span>':'';
      return '<div class="ios-row" data-tx="'+t.id+'"><div class="row-icon" style="background:'+catColor(t.type,t.category)+'">'+esc(t.category.slice(0,1))+'</div><div class="row-main"><div class="row-title">'+esc(t.category)+rec+'</div>'+(t.note?'<div class="row-sub">'+esc(t.note)+'</div>':'')+'</div><span class="row-amt '+t.type+'">'+(t.type==='expense'?'−':'+')+fmt(t.amount)+'</span><span class="chevron">›</span></div>';
    }).join('');
    return '<div class="day-head">'+label+'</div><div class="ios-list">'+rows+'</div>';
  }).join('');
  el.querySelectorAll('[data-tx]').forEach(row=>{
    row.addEventListener('click',()=>openTxSheet(Number(row.dataset.tx)));
  });
}

function renderBudgets(list){
  const key=monthKey(viewDate);
  const monthBudgets=budgets[key]||{};
  const expenses=list.filter(t=>t.type==='expense');
  const spentByCat={};
  expenses.forEach(t=>{spentByCat[t.category]=(spentByCat[t.category]||0)+t.amount});

  const totalBudget=Object.values(monthBudgets).reduce((s,v)=>s+v,0);
  document.getElementById('budgetTotal').textContent=fmt(totalBudget);

  const el=document.getElementById('budgetList');
  const cats=EXP_CATS;
  el.innerHTML=cats.map(c=>{
    const limit=monthBudgets[c.name]||0;
    const spent=spentByCat[c.name]||0;
    const pct=limit?Math.min(100,Math.round(spent/limit*100)):0;
    let cls='ok',fillColor=c.color;
    if(limit>0 && spent>=limit){cls='over';fillColor='#FF453A'}
    else if(limit>0 && spent>=limit*0.7){cls='warn';fillColor='#FF9F0A'}
    else if(limit>0){cls='ok';fillColor='#30D158'}
    const valText=limit?fmt(spent)+' / '+fmt(limit):(spent?fmt(spent)+' (без лимита)':'не задан');
    return '<div class="budget-row" data-budget="'+esc(c.name)+'"><div class="budget-top"><span class="cat-dot" style="background:'+c.color+'"></span><span class="b-name">'+esc(c.name)+'</span><span class="b-val '+cls+'">'+valText+'</span></div><div class="budget-bar"><div class="budget-bar-fill" style="width:'+(limit?pct:(spent?100:0))+'%;background:'+fillColor+'"></div></div></div>';
  }).join('');

  el.querySelectorAll('[data-budget]').forEach(row=>{
    row.addEventListener('click',()=>openBudgetSheet(row.dataset.budget));
  });
}

function renderDebts(){
  const active=debts.filter(d=>!d.settled).sort((a,b)=>(b.id||0)-(a.id||0));
  const settled=debts.filter(d=>d.settled).sort((a,b)=>(b.id||0)-(a.id||0));
  const inTotal=debts.filter(d=>!d.settled&&d.direction==='in').reduce((s,d)=>s+d.amount,0);
  const outTotal=debts.filter(d=>!d.settled&&d.direction==='out').reduce((s,d)=>s+d.amount,0);
  document.getElementById('debtIn').textContent=fmt(inTotal);
  document.getElementById('debtOut').textContent=fmt(outTotal);
  const el=document.getElementById('debtListWrap');
  if(debts.length===0){
    el.innerHTML='<div class="empty-note">Долгов пока нет — нажмите «+», чтобы добавить</div>';
    return;
  }
  function rowHtml(d){
    const color=d.direction==='in'?'#30D158':'#FF453A';
    const initial=d.person?d.person.trim().slice(0,1).toUpperCase():'?';
    const dd=d.date?new Date(d.date+'T00:00:00'):null;
    const dateStr=dd?dd.getDate()+' '+MONTHS[dd.getMonth()]:'';
    const sub=[d.note,dateStr].filter(Boolean).join(' · ');
    return '<div class="ios-row debt-row '+(d.settled?'settled':'')+'" data-debt="'+d.id+'"><div class="check-toggle '+(d.settled?'on':'')+'" data-check="'+d.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><path d="M5 12l5 5L19 7"/></svg></div><div class="avatar" style="background:'+color+'">'+esc(initial)+'</div><div class="row-main"><div class="row-title">'+esc(d.person||'Без имени')+'</div>'+(sub?'<div class="row-sub">'+esc(sub)+'</div>':'')+'</div><span class="row-amt '+(d.direction==='in'?'income':'expense')+'">'+fmt(d.amount)+'</span><span class="chevron">›</span></div>';
  }
  let html='';
  if(active.length)html+='<div class="section-label">Активные</div><div class="ios-list">'+active.map(rowHtml).join('')+'</div>';
  if(settled.length)html+='<div class="section-label">Закрытые</div><div class="ios-list">'+settled.map(rowHtml).join('')+'</div>';
  el.innerHTML=html;
  el.querySelectorAll('[data-check]').forEach(chk=>{
    chk.addEventListener('click',e=>{
      e.stopPropagation();
      const id=Number(chk.dataset.check);
      const d=debts.find(x=>x.id===id);
      if(d){d.settled=!d.settled;saveDebts();render()}
    });
  });
  el.querySelectorAll('[data-debt]').forEach(row=>{
    row.addEventListener('click',()=>openDebtSheet(Number(row.dataset.debt)));
  });
}

const txOverlay=document.getElementById('txOverlay');
const amountInput=document.getElementById('amountInput');
const dateInput=document.getElementById('dateInput');

function renderTxChips(){
  const cats=txType==='expense'?EXP_CATS:INC_CATS;
  if(!cats.find(c=>c.name===txCat))txCat=cats[0].name;
  document.getElementById('categoryChips').innerHTML=cats.map(c=>'<div class="chip '+(c.name===txCat?'active':'')+'" data-cat="'+esc(c.name)+'">'+esc(c.name)+'</div>').join('');
  document.querySelectorAll('#categoryChips .chip').forEach(chip=>{
    chip.addEventListener('click',()=>{txCat=chip.dataset.cat;renderTxChips()});
  });
}
function updateTxToggle(){
  document.getElementById('toggleExpense').classList.toggle('active',txType==='expense');
  document.getElementById('toggleIncome').classList.toggle('active',txType==='income');
  document.getElementById('toggleOnce').classList.toggle('active',txRecurring==='none');
  document.getElementById('toggleMonthly').classList.toggle('active',txRecurring==='monthly');
  document.getElementById('recDayField').style.display=txRecurring==='monthly'?'block':'none';
}
function openTxSheet(id){
  txEditId=id||null;
  const t=txEditId?txs.find(x=>x.id===txEditId):null;
  txType=t?t.type:'expense';
  txCat=t?t.category:EXP_CATS[0].name;
  txRecurring=t&&t.recurring==='monthly'?'monthly':'none';
  txRecDay=t&&t.recDay?t.recDay:new Date().getDate();
  amountInput.value=t?String(t.amount):'';
  dateInput.value=t?t.date:new Date().toISOString().slice(0,10);
  document.getElementById('recDayInput').value=txRecDay;
  document.getElementById('noteInput').value=t?(t.note||''):'';
  document.getElementById('txSheetTitle').textContent=t?'Изменить операцию':'Новая операция';
  document.getElementById('txDelete').style.display=t?'block':'none';
  updateTxToggle();
  renderTxChips();
  txOverlay.classList.add('show');
}
function closeTxSheet(){txOverlay.classList.remove('show')}

document.getElementById('fabBtn').addEventListener('click',()=>{
  if(activeTab==='debts')openDebtSheet(null);
  else if(activeTab==='budgets')openBudgetSheet(null);
  else openTxSheet(null);
});
document.getElementById('txCancel').addEventListener('click',closeTxSheet);
txOverlay.addEventListener('click',e=>{if(e.target===txOverlay)closeTxSheet()});
document.getElementById('toggleExpense').addEventListener('click',()=>{txType='expense';updateTxToggle();renderTxChips()});
document.getElementById('toggleIncome').addEventListener('click',()=>{txType='income';updateTxToggle();renderTxChips()});
document.getElementById('toggleOnce').addEventListener('click',()=>{txRecurring='none';updateTxToggle()});
document.getElementById('toggleMonthly').addEventListener('click',()=>{txRecurring='monthly';updateTxToggle()});
document.getElementById('recDayInput').addEventListener('input',e=>{
  let v=parseInt(e.target.value.replace(/[^0-9]/g,'')||'0',10);
  if(v>31)v=31; if(v<0)v=0;
  txRecDay=v;
  e.target.value=v||'';
});
amountInput.addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9]/g,'')});

document.getElementById('txSave').addEventListener('click',()=>{
  const amount=Number(amountInput.value);
  if(!amount||amount<=0){amountInput.focus();return}
  const date=dateInput.value||new Date().toISOString().slice(0,10);
  const note=document.getElementById('noteInput').value.trim();
  const recDay=txRecurring==='monthly'?Math.min(31,Math.max(1,txRecDay||1)):null;

  if(txEditId){
    const t=txs.find(x=>x.id===txEditId);
    Object.assign(t,{type:txType,amount,category:txCat,date,note,recurring:txRecurring==='monthly'?'monthly':null,recDay});
    if(txRecurring!=='monthly'){delete t.recurring;delete t.recDay;delete t.lastCreated}
  }else{
    const obj={id:Date.now(),type:txType,amount,category:txCat,date,note};
    if(txRecurring==='monthly'){obj.recurring='monthly';obj.recDay=recDay}
    txs.push(obj);
  }
  saveTxs();
  const d=new Date(date+'T00:00:00');
  viewDate=new Date(d.getFullYear(),d.getMonth(),1);
  closeTxSheet();
  render();
});
document.getElementById('txDelete').addEventListener('click',()=>{
  if(txEditId){txs=txs.filter(t=>t.id!==txEditId);saveTxs()}
  closeTxSheet();
  render();
});

const debtOverlay=document.getElementById('debtOverlay');
const debtAmountInput=document.getElementById('debtAmountInput');
const debtPersonInput=document.getElementById('debtPersonInput');
const debtDateInput=document.getElementById('debtDateInput');
const debtNoteInput=document.getElementById('debtNoteInput');

function updateDebtToggle(){
  document.getElementById('toggleIn').classList.toggle('active',debtDir==='in');
  document.getElementById('toggleOut').classList.toggle('active',debtDir==='out');
}
function openDebtSheet(id){
  debtEditId=id||null;
  const d=debtEditId?debts.find(x=>x.id===debtEditId):null;
  debtDir=d?d.direction:'in';
  debtAmountInput.value=d?String(d.amount):'';
  debtPersonInput.value=d?(d.person||''):'';
  debtDateInput.value=d?(d.date||''):new Date().toISOString().slice(0,10);
  debtNoteInput.value=d?(d.note||''):'';
  document.getElementById('debtSheetTitle').textContent=d?'Изменить долг':'Новый долг';
  document.getElementById('debtDelete').style.display=d?'block':'none';
  updateDebtToggle();
  debtOverlay.classList.add('show');
}
function closeDebtSheet(){debtOverlay.classList.remove('show')}

document.getElementById('debtCancel').addEventListener('click',closeDebtSheet);
debtOverlay.addEventListener('click',e=>{if(e.target===debtOverlay)closeDebtSheet()});
document.getElementById('toggleIn').addEventListener('click',()=>{debtDir='in';updateDebtToggle()});
document.getElementById('toggleOut').addEventListener('click',()=>{debtDir='out';updateDebtToggle()});
debtAmountInput.addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9]/g,'')});

document.getElementById('debtSave').addEventListener('click',()=>{
  const amount=Number(debtAmountInput.value);
  if(!amount||amount<=0){debtAmountInput.focus();return}
  const person=debtPersonInput.value.trim()||'Без имени';
  const date=debtDateInput.value||new Date().toISOString().slice(0,10);
  const note=debtNoteInput.value.trim();
  if(debtEditId){
    const d=debts.find(x=>x.id===debtEditId);
    Object.assign(d,{direction:debtDir,amount,person,date,note});
  }else{
    debts.push({id:Date.now(),direction:debtDir,amount,person,date,note,settled:false});
  }
  saveDebts();
  closeDebtSheet();
  render();
});
document.getElementById('debtDelete').addEventListener('click',()=>{
  if(debtEditId){debts=debts.filter(d=>d.id!==debtEditId);saveDebts()}
  closeDebtSheet();
  render();
});

const budgetOverlay=document.getElementById('budgetOverlay');
const budgetAmountInput=document.getElementById('budgetAmountInput');

function renderBudgetChips(){
  document.getElementById('budgetChips').innerHTML=EXP_CATS.map(c=>'<div class="chip '+(c.name===budgetEditCat?'active':'')+'" data-bcat="'+esc(c.name)+'">'+esc(c.name)+'</div>').join('');
  document.querySelectorAll('#budgetChips .chip').forEach(chip=>{
    chip.addEventListener('click',()=>{budgetEditCat=chip.dataset.bcat;renderBudgetChips()});
  });
}
function openBudgetSheet(cat){
  const key=monthKey(viewDate);
  const monthBudgets=budgets[key]||{};
  if(cat && monthBudgets[cat]!==undefined){
    budgetEditCat=cat;
    budgetAmountInput.value=String(monthBudgets[cat]);
    document.getElementById('budgetSheetTitle').textContent='Изменить лимит';
    document.getElementById('budgetDelete').style.display='block';
  }else{
    budgetEditCat=cat||EXP_CATS[0].name;
    budgetAmountInput.value=cat&&monthBudgets[cat]?String(monthBudgets[cat]):'';
    document.getElementById('budgetSheetTitle').textContent='Новый лимит';
    document.getElementById('budgetDelete').style.display='none';
  }
  renderBudgetChips();
  budgetOverlay.classList.add('show');
}
function closeBudgetSheet(){budgetOverlay.classList.remove('show')}

document.getElementById('budgetCancel').addEventListener('click',closeBudgetSheet);
budgetOverlay.addEventListener('click',e=>{if(e.target===budgetOverlay)closeBudgetSheet()});
budgetAmountInput.addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9]/g,'')});

document.getElementById('budgetSave').addEventListener('click',()=>{
  const amount=Number(budgetAmountInput.value);
  if(!amount||amount<=0){budgetAmountInput.focus();return}
  const key=monthKey(viewDate);
  if(!budgets[key])budgets[key]={};
  budgets[key][budgetEditCat]=amount;
  saveBudgets();
  closeBudgetSheet();
  render();
});
document.getElementById('budgetDelete').addEventListener('click',()=>{
  const key=monthKey(viewDate);
  if(budgets[key]&&budgets[key][budgetEditCat]!==undefined){
    delete budgets[key][budgetEditCat];
    saveBudgets();
  }
  closeBudgetSheet();
  render();
});

loadAll();
})();
</script>
